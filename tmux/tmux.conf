# ==========================================
# 1. 基础全局优化 (保持原生 Ctrl+b)
# ==========================================
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
set -g base-index 1           # 窗口编号从1开始
setw -g pane-base-index 1      # 面板编号从1开始
set -g history-limit 10000
set -g mouse on               # 开启鼠标支持

# 保持当前路径：分割面板时自动进入当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 快捷配置重载
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# ==========================================
# 2. 视觉美化 (极简现代风)
# ==========================================
set -g status-style "bg=#282c34,fg=#abb2bf"
setw -g window-status-current-style "bg=#61afef,fg=#282c34,bold"
set -g status-left "#[fg=green,bold] [#S] "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M #[fg=white]#H"

# ==========================================
# 3. TPM 插件管理
# ==========================================

# 声明插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # 提供一系列通用的基础设置优化
set -g @plugin 'tmux-plugins/tmux-resurrect'     # 核心：手动保存/恢复会话
set -g @plugin 'tmux-plugins/tmux-continuum'     # 核心：自动保存/恢复会话
set -g @plugin 'christoomey/vim-tmux-navigator' # 如果你用 Vim，这个插件神级好用
set -g @plugin 'tmux-plugins/tmux-yank'          # 增强复制粘贴功能

# --- 插件详细配置 ---

# Continuum 自动恢复设置
set -g @continuum-restore 'on'      # 启动 tmux 时自动恢复上一次保存的会话
set -g @continuum-save-interval '15' # 每15分钟自动保存一次

# Resurrect 策略：同时恢复进程（比如 vim, ssh, tail）
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# 初始化 TPM (这行必须在最底部)
run '~/.tmux/plugins/tpm/tpm'
